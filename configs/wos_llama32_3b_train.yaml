### model
model_name_or_path: "<BASE_MODEL_ROOT>/Llama-3.2-3B-Instruct"
flash_attn: sdpa
disable_gradient_checkpointing: true
hdlm_think_layer_index: 25
hdlm_think_loss_weight: 2.0
hdlm_final_loss_weight: 1.0

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 4
freeze_trainable_modules: all
freeze_extra_modules: new_lm_head
pure_bf16: true

### dataset
dataset_dir: data
dataset: WoS-HdLM
template: hdlm_wos
cutoff_len: 2048
max_samples: 10
packing: false
preprocessing_num_workers: 1
dataloader_num_workers: 0

### output
output_dir: runs/wos_llama32_3b_yaml
logging_steps: 1
save_strategy: steps
save_steps: 10
save_total_limit: 1
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 5.0e-6
max_steps: 10
lr_scheduler_type: constant
optim: adamw_torch_fused
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
seed: 42
